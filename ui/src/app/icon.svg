<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The mark, at favicon size. Same drawing as `.syndra-mark` in globals.css:
    a faint base ring, a brighter arc falling off from the apex, a lit dot.

    Two deliberate departures from the CSS version, both forced by the medium:

    1. The arc's falloff is two solid-stroke bands rather than a conic mask.
       SVG has no conic gradient, and a gradient STROKE flattens to its first
       stop when rasterised — the fade vanishes and nothing looks wrong in the
       source. Solid strokes and gradient FILLS both survive, so the glow is a
       fill and the arc is stacked opacity.

    2. Colours are literal. A favicon is served standalone with no page and no
       custom properties to inherit; the theme it follows is the operating
       system's, which is what the media query below is for.
  -->
  <style>
    .base { stroke: #9b7bff; stroke-opacity: .22 }
    .arc  { stroke: #cebcff }
    .dot  { fill: #9b7bff }
    .glow { fill: url(#glow) }
    @media (prefers-color-scheme: light) {
      .base { stroke: #5b3fd6; stroke-opacity: .18 }
      .arc  { stroke: #4c30c4 }
      .dot  { fill: #5b3fd6 }
    }
  </style>

  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#9b7bff" stop-opacity=".55" />
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- The full ring, quiet. -->
  <circle class="base" cx="16" cy="16" r="15.25" fill="none" stroke-width="1.5" />

  <!-- Lit from the apex: a wide dim band with a narrow bright one inside it. -->
  <path class="arc" d="M0.98 18.65A15.25 15.25 0 1 1 31.02 18.65" fill="none"
        stroke-width="1.5" stroke-opacity=".26" stroke-linecap="round" />
  <path class="arc" d="M2.79 8.37A15.25 15.25 0 0 1 29.21 8.37" fill="none"
        stroke-width="1.5" stroke-opacity=".62" stroke-linecap="round" />

  <circle class="glow" cx="16" cy="16" r="11" />
  <circle class="dot" cx="16" cy="16" r="5.6" />
</svg>
