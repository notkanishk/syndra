openapi: 3.1.0
info:
  title: Syndra add-on contract 1
  version: 1.0.0
  summary: The wire between the Syndra backend and a target add-on, exactly as contract 1 stands.
  description: >-
    Twelve routes, every one authenticated. Bodies are the JSON Schemas under schema/; fixtures/
    holds a golden document per message; registry/ lists the error codes and operation ids. Contract
    1 is pinned as it is: where the add-on's behaviour is irregular (an operation id the add-on does
    not know answers 404 OPERATION_FAILED, a blocked apply is a 4xx carrying an outcome) the schema
    follows the code.
  license:
    name: Proprietary
    identifier: LicenseRef-Syndra
servers:
  - url: https://addon.example.org:8443
    description: An add-on, on the internal network only.
security:
  - addonSignature: []
paths:
  /capabilities:
    get:
      operationId: getCapabilities
      summary: The manifest
      description: What the add-on can do. Served even while the target is unreachable.
      security:
        - addonSignature: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/manifest.json
        "401":
          $ref: "#/components/responses/Error"
  /health:
    get:
      operationId: getHealth
      summary: The add-on's own health
      description: Served even while the target is unreachable.
      security:
        - addonSignature: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/health.json
        "401":
          $ref: "#/components/responses/Error"
  /subjects:
    get:
      operationId: listSubjects
      summary: The target's current state
      description: >-
        Live when it can, from the mirror when it cannot, labelled either way. 503 NO_CURRENT_READ
        when neither exists.
      security:
        - addonSignature: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/subjects.json
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /values/{field}:
    get:
      operationId: getValues
      summary: What a field's values may be
      description: Read live; membership is runtime state.
      security:
        - addonSignature: []
      parameters:
        - name: field
          in: path
          required: true
          schema:
            type: string
          description: An entitlement field name from the manifest.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/values.json
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /reach:
    get:
      operationId: getReach
      summary: What each group opens
      description: Storage profile.
      security:
        - addonSignature: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/profiles/storage/reach.json
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /settings:
    get:
      operationId: listSettings
      summary: System-wide settings
      description: Where home folders go.
      security:
        - addonSignature: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/settings.json
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /homes:
    get:
      operationId: getHomes
      summary: Every home folder and its use
      description: Storage profile.
      security:
        - addonSignature: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/profiles/storage/homes.json
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /settings/{name}:
    put:
      operationId: putSetting
      summary: Set one setting
      description: >-
        Carries no contract_version today, and no call id: the Idempotency-Key header deduplicates.
        The value must be one the target offers right now, or empty.
      security:
        - addonSignature: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: >-
            The backend's operation record id; a replay is answered from the first call and writes
            nothing. Optional for an older backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schema/setting_put_request.json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/setting.json
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /plan:
    post:
      operationId: planChange
      summary: Rehearse a change
      description: Not a write.
      security:
        - addonSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schema/plan_request.json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/plan_response.json
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /apply:
    post:
      operationId: applyChange
      summary: Converge one subject
      description: >-
        Deduplicated on the body's call_id. A blocked apply (422) or a plan gone stale or a binding
        conflict (409) answers with an outcome or an error body.
      security:
        - addonSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schema/apply_request.json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/apply_response.json
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          description: >-
            PLAN_STALE or CALL_ID_REUSED (an error body), or an apply outcome describing a binding
            conflict.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: schema/apply_response.json
                  - $ref: schema/error.json
        "422":
          description: >-
            An apply outcome with effect blocked, or an error body (CONTRACT_VERSION_MISMATCH,
            TARGET_VERSION_UNSUPPORTED).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: schema/apply_response.json
                  - $ref: schema/error.json
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /operations/{name}:
    post:
      operationId: runOperation
      summary: Run one named operation
      description: >-
        The path names the operation; the body repeats it. Deduplicated on the body's call_id; only
        mutating operations are remembered. An unknown operation id answers 404 OPERATION_FAILED.
      security:
        - addonSignature: []
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schema/operation_request.json
      responses:
        "200":
          description: OK. At most one of activity, storage and health is present, by operation.
          content:
            application/json:
              schema:
                $ref: schema/operation_response.json
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /lifecycle:
    post:
      operationId: setLifecycle
      summary: Change the add-on's state at runtime
      description: active, draining or read_only; a reason is required.
      security:
        - addonSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: schema/lifecycle_request.json
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: schema/lifecycle_response.json
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    addonSignature:
      type: apiKey
      in: header
      name: X-Syndra-Addon-Signature
      description: >-
        HMAC over the method, the path, the body and a timestamp (two minutes' tolerance), keyed
        from the per-target secret; see transport_derivation.json. The query string is not covered.
  responses:
    Error:
      description: >-
        A refusal. The body is {"error": "<CODE>", ...extras}; codes, statuses and retry classes are
        in registry/errors.json.
      headers:
        Retry-After:
          description: Present on 503 LIFECYCLE_REFUSAL only.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: schema/error.json
