name: deploy-prod

# Deploys main to the production LXC (syndra) through a self-hosted runner
# living inside that LXC. The runner drives the long-lived clone at
# /opt/mkauth rather than its own workspace, because that directory holds
# .env, the Zitadel service-account key, and the named docker volumes' identity.
#
# Anyone who can push to main can run arbitrary commands in production through
# this file. Keep branch protection on main.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, mkauth-prod]
    steps:
      - name: Check out ${{ github.sha }} into /opt/mkauth
        run: |
          set -euo pipefail
          cd /opt/mkauth
          git fetch --prune origin
          git checkout --force "${{ github.sha }}"

      - name: Build and start
        run: |
          set -euo pipefail
          cd /opt/mkauth
          docker compose up -d --build --remove-orphans
          docker image prune -f

      - name: Smoke test
        run: |
          set -euo pipefail
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors \
            http://localhost:8080/healthz >/dev/null
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors \
            http://localhost:3000 >/dev/null
          echo "backend and ui responding"

      - name: Report container state on failure
        if: failure()
        run: |
          cd /opt/mkauth
          docker compose ps
          docker compose logs --tail=80
