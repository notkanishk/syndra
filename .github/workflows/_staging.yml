name: staging (reusable)

# Deploys one commit to the staging box (the dev LXC) through the self-hosted
# runner that lives there, and proves it: migrations applied clean, every
# service answering. Called by deploy.yml (main, before production) and by
# deploy-staging.yml (an experiment, by hand). Never call it from anything a
# fork can trigger: the runner has docker on that box and a copy of
# production's data.

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch or tag to deploy
        type: string
        required: true
      restore_prod_data:
        description: Reset staging's database to last night's copy of production first
        type: boolean
        default: true

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  staging:
    runs-on: [self-hosted, syndra-staging]
    timeout-minutes: 30
    env:
      STAGE_DIR: /opt/syndra
      PROD_DUMP: /var/lib/syndra-staging/prod-latest.dump
      # Production's Zitadel, last night's read-only copy, and the stand-in's
      # working copy of it (what ZITADEL_FAKE_WORLD in staging's .env names).
      PROD_WORLD: /var/lib/syndra-staging/prod-world.json
      WORLD: /var/lib/syndra-staging/world/world.json
    steps:
      - name: Check out ${{ inputs.ref }} into /opt/syndra
        env:
          # Read from the environment, never spliced into the script.
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
          ref="$DEPLOY_REF"
          # A full SHA (what deploy.yml's resolve job hands over) is checked out
          # exactly, never re-resolved. A name (an experiment from
          # deploy-staging.yml) prefers the remote branch over a stale local one.
          if printf '%s' "$ref" | grep -Ex '[0-9a-f]{40}' >/dev/null; then
            git checkout --force --detach "$ref"
            [ "$(git rev-parse HEAD)" = "$ref" ] || { echo "checked out $(git rev-parse HEAD), not $ref"; exit 1; }
          else
            if git rev-parse -q --verify "origin/$ref^{commit}" >/dev/null; then ref="origin/$ref"; fi
            git checkout --force --detach "$ref"
          fi
          echo "staging now at $(git rev-parse --short HEAD): $(git log -1 --format=%s)"
          # Every later docker compose call layers the staging override, when the
          # checked-out ref has one (an experiment from an older branch may not).
          if [ -f docker-compose.staging.yml ]; then
            echo "COMPOSE_FILE=docker-compose.yml:docker-compose.staging.yml" >> "$GITHUB_ENV"
          else
            echo "::warning::this ref has no docker-compose.staging.yml; the stand-in Zitadel is off for this deploy"
          fi

      # Production's data, last night's copy, so every migration and every
      # read runs against real rows before it runs on production. It also
      # wipes whatever an experiment left behind.
      - name: Reset the database to production's copy
        if: inputs.restore_prod_data
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          if [ ! -s "$PROD_DUMP" ]; then
            echo "::warning::no copy of production at $PROD_DUMP; keeping staging's own data"
            exit 0
          fi
          echo "copy of production taken $(date -r "$PROD_DUMP" '+%Y-%m-%d %H:%M')"
          docker compose stop backend claims truenas-addon 2>/dev/null || true
          docker compose up -d postgres
          for i in $(seq 1 30); do docker compose exec -T postgres pg_isready -U syndra -d postgres >/dev/null 2>&1 && break; sleep 2; done
          docker compose exec -T postgres sh -c 'dropdb -U "$POSTGRES_USER" --if-exists --force "$POSTGRES_DB" && createdb -U "$POSTGRES_USER" "$POSTGRES_DB"'
          docker compose exec -T postgres sh -c 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --no-owner --no-privileges --exit-on-error' < "$PROD_DUMP"
          echo "restored"

      # The stand-in Zitadel goes back to production's copy with the database,
      # so the grants it holds and the rows that explain them are one night's.
      - name: Reset the stand-in Zitadel to production's copy
        if: inputs.restore_prod_data
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          if [ ! -s "$PROD_WORLD" ]; then
            echo "::warning::no copy of production's Zitadel at $PROD_WORLD; keeping the stand-in's own"
            exit 0
          fi
          echo "copy of production's Zitadel taken $(date -r "$PROD_WORLD" '+%Y-%m-%d %H:%M')"
          docker compose stop backend 2>/dev/null || true
          mkdir -p "$(dirname "$WORLD")"
          cp "$PROD_WORLD" "$WORLD.tmp"
          mv "$WORLD.tmp" "$WORLD"
          echo "reset"

      # Built before the stop below, so the stop is followed by a start from
      # cached images, never by a build. (When the database was reset above,
      # the backend is already stopped; the old containers serve otherwise.)
      - name: Build the images
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          docker compose build

      # Contract 2, and every deploy after it (openspec/changes/addon-contract,
      # task 1.10). The images are built first (the step above), so the window
      # with nothing running is a stop and a start, never a build. The backend
      # stops FIRST — and with it the propagation
      # runner, which runs inside the backend process (cmd/api, periodic) — so
      # no old backend ever talks to a new add-on: it would read a contract-2
      # refusal with contract-1 rules, and only the new backend knows a shape
      # refusal is not the target refusing. Then the add-on, and only once it
      # has stopped is its store copied out, because a bbolt file is never
      # copied while it is open. Never mutations.log: it only grows, and a
      # restored one reads as a truncated log. The copy is a fallback only:
      # the store is written additively, so a rollback (the previous production
      # commit, dispatched through this workflow) restores nothing. This stops containers; never
      # the GitHub self-hosted runner, which is running this job.
      - name: Stop the backend, then the add-on, and keep the add-on's store
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          docker compose stop backend
          if docker compose ps -a --services | grep -x truenas-addon >/dev/null; then
            docker compose stop truenas-addon
            mkdir -p "$HOME/syndra-backups"
            f="$HOME/syndra-backups/truenas-state-$(date +%Y%m%d-%H%M%S)-$(git -C "$STAGE_DIR" rev-parse --short=8 HEAD).db"
            docker compose cp truenas-addon:/var/lib/syndra-truenas/state.db "$f"
            [ -s "$f" ] || { echo "empty copy of the add-on's store"; exit 1; }
            echo "add-on store: $f ($(du -h "$f" | cut -f1))"
            ls -1t "$HOME"/syndra-backups/truenas-state-*.db | tail -n +15 | xargs -r rm -f
          else
            echo "no truenas-addon container here; nothing to copy"
          fi

      - name: Build and start
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          docker compose up -d --build --remove-orphans
          docker image prune -f
          docker builder prune -f --keep-storage 4GB

      - name: Smoke test
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          port() { docker compose port "$1" "$2" | sed 's/.*://'; }
          api="http://localhost:$(port backend 8080)"
          ui="http://localhost:$(port ui 3000)"
          claims="http://localhost:$(port claims 8090)"
          curl -fsS --retry 30 --retry-delay 3 --retry-all-errors "$api/healthz" >/dev/null
          curl -fsS --retry 30 --retry-delay 3 --retry-all-errors "$ui" >/dev/null
          echo "backend and ui answering"
          for url in "$api/healthz/claims" "$claims/healthz/claims"; do
            code="$(curl -sS -o /tmp/claims.json -w '%{http_code}' -m 10 --retry 10 --retry-delay 2 --retry-connrefused "$url")"
            case "$code" in
              200|503) echo "$url: $(cat /tmp/claims.json)" ;;
              *) echo "$url answered HTTP $code"; exit 1 ;;
            esac
          done

      # The migration the code expects is the migration the database is at,
      # and not dirty. This is the check that would have caught a migration
      # that only fails on real rows.
      - name: Migrations applied clean
        run: |
          set -euo pipefail
          cd "$STAGE_DIR"
          want="$(ls backend/db/migrations | sed -n 's/^0*\([0-9][0-9]*\)_.*\.up\.sql$/\1/p' | sort -n | tail -1)"
          got="$(docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c "select version, dirty from schema_migrations"' | tr -d '[:space:]')"
          echo "expected at least ${want}|f, database says: $got"
          # At least: a rollback deploys an older backend onto a newer, clean,
          # additive schema, which it starts on as it is (db.migrateUp).
          [ "${got#*|}" = f ] && [ "${got%%|*}" -ge "$want" ] || { echo "migration behind or dirty"; exit 1; }
          echo "migrations clean at ${got%%|*} (this code knows $want)"

      # Whatever failed, nothing is left down. Not gated on the build, unlike
      # production: the reset steps above stop services BEFORE the build, so
      # a failed build can already have left staging down.
      - name: Start everything again on failure
        if: failure()
        run: |
          cd "$STAGE_DIR"
          docker compose up -d

      - name: Report container state on failure
        if: failure()
        run: |
          cd "$STAGE_DIR"
          docker compose ps
          docker compose logs --tail=80
