services:
  postgres:
    image: postgres:15-alpine
    container_name: mkauth_postgres
    environment:
      POSTGRES_USER: mkauth
      POSTGRES_PASSWORD: mkauth_secure_password # Change in production
      POSTGRES_DB: mkauthdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mkauth"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mkauth_redis
    volumes:
      - redisdata:/data
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mkauth_backend
    environment:
      - DB_DSN=${DB_DSN:-postgres://mkauth:mkauth_secure_password@postgres:5432/mkauthdb?sslmode=disable}
      - REDIS_URL=${REDIS_URL:-redis:6379}
      - PORT=${PORT:-8080}
      - MKAUTH_API_KEY=${MKAUTH_API_KEY:-dev_auth_token_secret}
      - MKAUTH_SEED_DEMO=${MKAUTH_SEED_DEMO:-true}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - MIGRATION_PATH=${MIGRATION_PATH:-file:///app/db/migrations}
      - ZITADEL_DOMAIN=${ZITADEL_DOMAIN:-}
      - ZITADEL_AUDIENCE=${ZITADEL_AUDIENCE:-}
      - ZITADEL_MACHINE_KEY_PATH=${ZITADEL_MACHINE_KEY_PATH:-}
      - ZITADEL_ADMIN_ROLE_KEY=${ZITADEL_ADMIN_ROLE_KEY:-admin}
      - ZITADEL_WEBHOOK_SECRET=${ZITADEL_WEBHOOK_SECRET:-}
    volumes:
      # Mount the Zitadel service account key file into the container.
      # ZITADEL_SA_KEY_HOST_PATH on the host → ZITADEL_MACHINE_KEY_PATH inside.
      - ${ZITADEL_SA_KEY_HOST_PATH:-/dev/null}:${ZITADEL_MACHINE_KEY_PATH:-/tmp/zitadel-sa-key.json}:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: mkauth_ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
      - MKAUTH_API_KEY=${MKAUTH_API_KEY:-dev_auth_token_secret}
      - ZITADEL_DOMAIN=${ZITADEL_DOMAIN:-}
      - ZITADEL_CLIENT_ID=${ZITADEL_CLIENT_ID:-}
      - ZITADEL_ADMIN_ROLE_KEY=${ZITADEL_ADMIN_ROLE_KEY:-admin}
    restart: unless-stopped

  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: mkauth_sync
    environment:
      - BACKEND_URL=http://backend:8080
      - MKAUTH_API_KEY=${MKAUTH_API_KEY:-dev_auth_token_secret}
      - LLDAP_URL=${LLDAP_URL:-ldaps://lldap:636}
      - LLDAP_BIND_DN=${LLDAP_BIND_DN:-cn=admin,ou=people,dc=example,dc=com}
      - LLDAP_BIND_PASSWORD=${LLDAP_BIND_PASSWORD:-}
      - LLDAP_BASE_DN=${LLDAP_BASE_DN:-dc=example,dc=com}
      - LLDAP_INSECURE_SKIP_VERIFY=${LLDAP_INSECURE_SKIP_VERIFY:-false}
      - SYNC_POLL_INTERVAL=${SYNC_POLL_INTERVAL:-10s}
      - SYNC_WORKER_COUNT=${SYNC_WORKER_COUNT:-5}
      - SYNC_INTENT_LIMIT=${SYNC_INTENT_LIMIT:-50}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
