schema: spec-driven

context: |
  Tech stack: Go backend, Next.js (Bun) frontend, PostgreSQL, Redis
  Sync service: Go, go-ldap/v3, separate Docker container
  Deployment: Docker Compose in Proxmox LXC
  Domain: Identity & Access Management (IAM) for academic makerspace
  IdP chain: Google Workspace -> Zitadel (OIDC) -> Syndra (orchestration) -> LLDAP (legacy bridge)
  External boundary: Zitadel Actions v2 is the only source-of-truth claim integration path
  Conventions: strict JSON decoding, injectable deps, backend-first testing, 200+ tests
  Navigation: see openspec/INDEX.md for the full spec graph

rules:
  proposal:
    - Keep proposals under 500 words
    - Always state which roadmap phase this targets
    - State impact on the three architectural planes (Control, Data, Bridge)
  design:
    - Cross-reference related change proposals and capability specs
    - Explicitly state which roadmap phase this targets
    - Include a Verification section with build/test commands
  tasks:
    - Break tasks into chunks of max 2 hours
    - Include test tasks for every implementation task
    - Use P1/P2 fix sections for post-review corrections
