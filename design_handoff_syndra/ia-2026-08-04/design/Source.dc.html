<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display:inline-flex;align-items:center;gap:7px;font-family:Figtree,system-ui,sans-serif;font-size:12.5px;line-height:1;white-space:nowrap">
  <sc-if value="{{ isDirect }}" hint-placeholder-val="{{ true }}">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:999px;background:rgba(216,242,78,.15);color:#d8f24e;font-weight:600">
      <i style="width:8px;height:8px;border-radius:999px;background:#d8f24e;flex:none"></i>Direct
    </span>
  </sc-if>
  <sc-if value="{{ isBundle }}">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:999px;background:rgba(243,245,239,.08);color:rgba(243,245,239,.82);font-weight:600">
      <i style="width:8px;height:8px;border-radius:999px;border:2px solid rgba(243,245,239,.8);flex:none"></i>Via bundle
    </span>
  </sc-if>
  <sc-if value="{{ isAuto }}">
    <span style="display:inline-flex;align-items:center;gap:6px;padding:5px 11px 5px 9px;border-radius:999px;border:1px dashed rgba(243,245,239,.34);color:rgba(243,245,239,.66);font-weight:600">
      <i style="width:8px;height:8px;border-radius:999px;border:1px dashed rgba(243,245,239,.66);flex:none"></i>Automatic
    </span>
  </sc-if>
  <sc-if value="{{ detail }}">
    <span style="font-size:12.5px;color:rgba(243,245,239,.5)">{{ detail }}</span>
  </sc-if>
</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:40},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;direct&quot;,&quot;bundle&quot;,&quot;mapping&quot;],&quot;default&quot;:&quot;direct&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;detail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind || "direct";
    return {
      isDirect: k === "direct", isBundle: k === "bundle", isAuto: k === "mapping",
      detail: this.props.detail || null
    };
  }
}

</script>
</body>
</html>
